<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Công Cụ Crawler Tin Tức</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header>
    <div class="top-header">
      <div class="container logo-container">
        <a href="index.html" class="logo">DÂN TRÍ DEMO</a>
        <a href="index.html" class="btn-crawler-link"><i class="fa-solid fa-house"></i> Về Trang Chủ</a>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <section class="crawler-box">
      <h2><i class="fa-solid fa-spider"></i> Công Cụ Thu Thập Bài Viết Tin Tức</h2>
      <p>Nhập liên kết bài viết từ báo Dân trí để cào dữ liệu và tự động lưu vào LocalStorage.</p>
      
      <div class="form-group">
        <input type="url" id="crawl-url" placeholder="https://dantri.com.vn/..." required>
        <button id="btn-crawl" onclick="handleCrawl()"><i class="fa-solid fa-download"></i> Crawl Dữ Liệu</button>
      </div>

      <div id="status-message" class="status-msg"></div>

      <div id="json-result-box" class="json-box hidden">
        <h3>Dữ liệu JSON thu thập được:</h3>
        <pre><code id="json-output"></code></pre>
      </div>
    </section>
  </main>

  <!-- Nhúng file crawler.js và app.js -->
  <script src="crawler.js"></script>
  <script src="app.js"></script>
</body>
</html>
